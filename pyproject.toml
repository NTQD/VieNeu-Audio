[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
index-strategy = "unsafe-best-match"
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
override-dependencies = [
    "nvidia-nccl-cu12; sys_platform == 'linux'",
]
# default-groups = ["web"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "llama-cpp-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal/"
explicit = true

[project]
name = "vieneu"
version = "2.7.0"
description = "Advanced on-device Vietnamese TTS with instant voice cloning"
readme = "README_PYPI.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
keywords = [
    "text-to-speech",
    "tts",
    "vietnamese",
    "voice-cloning",
    "speech-synthesis",
    "real-time",
    "on-device"
]
authors = [
    { name = "Phạm Nguyễn Ngọc Bảo", email = "pnnbao@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "sea-g2p>=0.7.5",
    "onnxruntime>=1.20.0",
    "llama-cpp-python==0.3.19",
    "requests",
    "numpy",
    "soundfile",
    "PyYAML",
    "gradio>=5.49.1",
    "perth>=0.2.0",
    "librosa>=0.11.0",
    "tqdm",
    "faster-whisper>=1.2.1",
]

[project.urls]
"Homepage" = "https://github.com/pnnbao97/VieNeu-TTS"
"Repository" = "https://github.com/pnnbao97/VieNeu-TTS"
"Bug Tracker" = "https://github.com/pnnbao97/VieNeu-TTS/issues"
"Documentation" = "https://github.com/pnnbao97/VieNeu-TTS/blob/main/README.md"
"Source Code" = "https://github.com/pnnbao97/VieNeu-TTS"
"Changelog" = "https://github.com/pnnbao97/VieNeu-TTS/releases"

[project.optional-dependencies]
gpu = [
    "torch",
    "torchaudio",
    "neucodec>=0.0.4",
    "lmdeploy; sys_platform != 'darwin'",
    "triton-windows; sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
    "transformers; sys_platform == 'darwin'",
    "accelerate; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]
gpu = [
    "neucodec>=0.0.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "datasets>=3.2.0",
    "perth>=0.2.0",
    "lmdeploy; sys_platform != 'darwin'",
    "triton-windows; sys_platform == 'win32'",
    "triton; sys_platform == 'linux'",
    "transformers; sys_platform == 'darwin'",
    "accelerate; sys_platform == 'darwin'",
    "trafilatura>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
vieneu-web = "apps.gradio_main:main"
vieneu-stream = "apps.web_stream:main"

[tool.setuptools]
package-dir = {"" = "src", "apps" = "apps", "examples" = "examples"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vieneu*", "vieneu_utils*", "apps*", "examples*"]

[tool.setuptools.package-data]
vieneu = ["assets/samples/*"]

[tool.uv.sources]

torch = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" }
]

torchaudio = [
    { index = "pytorch", marker = "sys_platform != 'darwin'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" }
]

lmdeploy = [
    { url = "https://github.com/InternLM/lmdeploy/releases/download/v0.11.0/lmdeploy-0.11.0+cu128-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
    { url = "https://github.com/InternLM/lmdeploy/releases/download/v0.11.0/lmdeploy-0.11.0+cu128-cp312-cp312-manylinux2014_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" }
]

# QUAN TRỌNG (2026-09-09): bản wheel Windows cũ (0.3.16, GitHub Release
# "wheels-v0.3.16" của pnnbao97/VieNeu-TTS) đã BỊ XOÁ HOÀN TOÀN — xác nhận
# qua GitHub API (release không còn tồn tại nữa, không phải chỉ mất 1
# asset). PyPI chỉ có sdist cho 0.3.16 (không có wheel dựng sẵn nào), nên
# không có cách nào khôi phục lại đúng bản cũ mà không cần compiler.
#
# Đổi sang bản CHÍNH THỨC mới nhất có wheel Windows còn sống —
# llama-cpp-python 0.3.19 từ chính repo gốc abetlen/llama-cpp-python (không
# phải bản build riêng của pnnbao97 nữa) — đã kiểm chứng THẬT trên máy CPU
# này: cài thành công, load đúng model GGUF hiện có, chạy infer() ra RTF
# ~0.68 (tương đương bản 0.3.16 cũ, RTF ~0.77), API Llama.from_pretrained()
# với các kwarg src/vieneu/standard.py._load_backbone() đang dùng
# (n_gpu_layers, flash_attn, repetitive_penalty, mlock, n_ctx) không lỗi.
# Cả 3 nguồn (win32, darwin, pypi) đều xác nhận CÓ bản 0.3.19 trước khi ghim.
#
# LƯU Ý (v5, 2026-09-10): VoxDirector AI (voxdirector/, pipeline/) đã chuyển
# hẳn sang Piper cho TTS — xem VoxDirectorAI_Technical_Spec.md Section 5.
# llama-cpp-python/vieneu KHÔNG còn được VoxDirector dùng nữa, nhưng vẫn giữ
# nguyên ở đây vì repo này cũng chính là source của gói SDK `vieneu` (PyPI),
# 1 sản phẩm độc lập không phụ thuộc vào lựa chọn TTS engine của VoxDirector.
llama-cpp-python = [
    { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
    { index = "llama-cpp-metal", marker = "sys_platform == 'darwin'" },
    { index = "pypi", marker = "sys_platform != 'win32' and sys_platform != 'darwin'" }
]
