# Section 12 cua spec: reverse proxy duy nhat truoc frontend + backend.
# QUAN TRONG: /api/ws/ can "Upgrade"/"Connection" header rieng cho
# WebSocket - proxy_pass thuong (khong co block nay) se lam hong ket noi
# WebSocket cua Step 9 (Beta/TTS/QA progress streaming that).

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # 2026-09-14 - Fix loi 413 "Failed to load background image" khi upload
    # anh nen cho video (POST /api/background-image/{job_id}, xem
    # backend/app/main.py::upload_background_image()): nginx MAC DINH gioi
    # han client_max_body_size = 1m khi khong dat gi ca - hau het anh nen
    # thuc te (anh chup/do phan giai cao) da vuot qua muc nay, bi nginx tu
    # choi TRUOC KHI request cham toi FastAPI (backend khong he gioi han
    # kich thuoc file trong code, xem UploadFile trong main.py) nen backend
    # khong the sua duoc loi nay, chi nginx moi sua duoc. 20M du cho anh nen
    # phan giai cao THONG THUONG; cung nam gon o server-block nay (khong
    # rieng /api/) vi POST /api/submit gui CA VAN BAN goc dang JSON, tieu
    # thuyet that dai co the cung vuot 1M mac dinh.
    client_max_body_size 20M;

    # certbot ACME challenge (Section 12: "purchased domain... certbot").
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Alpha (Step 9) co the mat >60s cho van ban dai + Gemini retry
        # backoff (toi da 2+4+8=14s/lan, nhieu lan goi trong 1 request) -
        # timeout mac dinh cua nginx (60s) qua ngan cho request nay.
        proxy_read_timeout 180s;
    }
}
